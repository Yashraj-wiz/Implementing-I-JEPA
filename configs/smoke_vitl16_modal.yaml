# Modal smoke run (2026-09-28): ViT-L/16 geometry on synthetic 224px images, 10 steps, L4.
# Checks the hf_image build, the datasets-before-torch import, ViT-L forward/backward on a real GPU, bf16,
# and a checkpoint write + Volume commit. No dataset needed.
model:
  image_size: 224
  patch_size: 16
  encoder_dim: 1024
  encoder_depth: 24
  encoder_heads: 16
  predictor_dim: 384
  predictor_depth: 12
  predictor_heads: 16
  mlp_ratio: 4.0
mask:
  num_targets: 4
  target_scale: [0.15, 0.20]
  context_scale: [0.85, 1.0]
  target_aspect: [0.75, 1.5]
  min_context_patches: 10
seed: 7
data:
  name: synthetic
  image_size: 224
  synthetic_count: 64
  batch_size: 16
  num_workers: 0
  pin_memory: false
  seed: 7
objective:
  loss: l2
  normalize_targets: true
optimization:
  lr: 0.00015
  start_lr: 0.00001
  final_lr: 0.000001
  warmup_steps: 2
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema: [0.996, 1.0]
  grad_clip: 1.0
training:
  epochs: 10
  total_steps: 10
  precision: bf16
  output_dir: /vol/runs/smoke_vitl16_l4
  log_every: 1
  checkpoint_every: 10
  resume: false
