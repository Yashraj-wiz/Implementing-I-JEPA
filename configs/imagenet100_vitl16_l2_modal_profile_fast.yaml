# Modal profile: ViT-L/16 batch 128 with loader-side masks + fewer GPU syncs (2026-09-28).
# Identical to imagenet100_vitl16_l2_modal_profile.yaml except data.masks_in_loader and training.sync_every_step.
seed: 31
data:
  name: imagenet100
  root: /vol/data/imagenet-100/data
  cache_dir: /vol/hf_cache
  image_size: 224
  crop_scale:
  - 0.3
  - 1.0
  batch_size: 128
  num_workers: 8
  pin_memory: true
  seed: 31
  masks_in_loader: true
model:
  image_size: 224
  patch_size: 16
  encoder_dim: 1024
  encoder_depth: 24
  encoder_heads: 16
  predictor_dim: 384
  predictor_depth: 12
  predictor_heads: 16
  mlp_ratio: 4.0
mask:
  num_targets: 4
  target_scale:
  - 0.15
  - 0.2
  context_scale:
  - 0.85
  - 1.0
  target_aspect:
  - 0.75
  - 1.5
  min_context_patches: 10
objective:
  loss: l2
  normalize_targets: true
optimization:
  lr: 0.0003
  start_lr: 1.0e-05
  final_lr: 1.0e-06
  warmup_steps: 10
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema:
  - 0.996
  - 1.0
  grad_clip: 1.0
training:
  epochs: 1
  total_steps: 60
  precision: bf16
  output_dir: /vol/runs/imagenet100_vitl16_profile
  log_every: 10
  checkpoint_every: 60
  archive_every: 0
  resume: false
  sync_every_step: false
