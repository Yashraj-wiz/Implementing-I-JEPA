seed: 31
data:
  name: imagenet100
  root: data/imagenet-100/data
  cache_dir: data/hf_cache
  image_size: 224
  crop_scale: [0.3, 1.0]
  batch_size: 64
  num_workers: 6
  pin_memory: true
  seed: 31
model:
  image_size: 224
  patch_size: 16
  encoder_dim: 384
  encoder_depth: 12
  encoder_heads: 6
  predictor_dim: 192
  predictor_depth: 6
  predictor_heads: 6
  mlp_ratio: 4.0
mask:
  num_targets: 4
  target_scale: [0.15, 0.20]
  context_scale: [0.85, 1.0]
  target_aspect: [0.75, 1.5]
  min_context_patches: 10
objective:
  loss: smooth_l1
  normalize_targets: true
optimization:
  lr: 0.00015
  start_lr: 0.00001
  final_lr: 0.000001
  warmup_steps: 10000
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema: [0.996, 1.0]
  grad_clip: 1.0
training:
  epochs: 300
  total_steps: 200000
  precision: bf16
  output_dir: artifacts/imagenet100_vits16_local
  log_every: 20
  checkpoint_every: 1000
  archive_every: 20000
  resume: true
