seed: 7
data:
  name: synthetic
  image_size: 64
  synthetic_count: 16
  batch_size: 4
  num_workers: 0
  pin_memory: false
  seed: 7
model:
  image_size: 64
  patch_size: 8
  encoder_dim: 64
  encoder_depth: 2
  encoder_heads: 4
  predictor_dim: 48
  predictor_depth: 2
  predictor_heads: 4
  mlp_ratio: 2.0
mask:
  num_targets: 4
  target_scale: [0.15, 0.20]
  context_scale: [0.85, 1.0]
  target_aspect: [0.75, 1.5]
  min_context_patches: 4
objective:
  loss: smooth_l1
  normalize_targets: true
optimization:
  lr: 0.0003
  start_lr: 0.00001
  final_lr: 0.000001
  warmup_steps: 2
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema: [0.996, 1.0]
  grad_clip: 1.0
training:
  epochs: 10
  total_steps: 8
  precision: fp32
  output_dir: artifacts/smoke
  log_every: 1
  checkpoint_every: 4
  resume: false
